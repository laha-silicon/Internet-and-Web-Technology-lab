<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC_SAME</title>
    <style>
        
        h1, h2, h3 
        {
            display: inline-block;
            margin-right: 15px; 
        }
        .separate-lines span
        {
            display: block;
            margin-bottom: 5px;
            font-size: large; 
            font-weight: 200;
            font-style: bold;
        }
    </style>
</head>
<body>
    <div>
        <h1>HTML</h1>
        <h2>CSS</h2>
        <h3>JavaScript</h3>
    </div>

    <div class="separate-lines">
        <span>JSP</span>
        <span>JDBC</span>
        <span>MySQL</span>
    </div>
</body>
</html>
