<html>
    <head>
        <title>Areas_JAVASCRIPT</title>
        <script language="Javascript">
            var a =  new Array(9,12,34,2,10);
            document.write("First Element="+a[0]+"<br>");
            document.write("Second Element="+a[1]+"<br>");
            document.write("Third Element="+a[2]+"<br>");
            document.write("Fourth Element="+a[3]+"<br>");
            document.write("Fifth Element="+a[4]+"<br>");
            document.write("Array is:"+a+"<br>");
            document.write("Array Elements Printing in the same order"+"<br>");
            var i;
            for(i=0; i<5; i++)
            {
                document.write(a[i]+"<br>");
            }
            document.write("Array Elements Printing in the Reverse Order"+"<br>");
            var i;
            for(i=4; i>=0; i--)
            {
                document.write(a[i]+"<br>");
            }
        </script>
    </head>
    <body bgcolor="black" text="yellow">
    </body>
</html>
